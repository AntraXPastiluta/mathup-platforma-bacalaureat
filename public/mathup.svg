<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern Gradient for Top Segment (Violet-Indigo) -->
    <linearGradient id="mathup-top-grad" x1="36" y1="16" x2="68" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    
    <!-- Modern Gradient for Bottom Segment (Indigo-Cyan) -->
    <linearGradient id="mathup-bottom-grad" x1="60" y1="60" x2="92" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    
    <!-- Premium Drop Shadow Glow -->
    <filter id="mathup-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366F1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Logo Group with Glow -->
  <g filter="url(#mathup-glow)">
    <!-- Bottom Segment -->
    <path 
      d="M60 68 L52 112 L92 60 H68 L60 68 Z" 
      fill="url(#mathup-bottom-grad)" 
    />
    
    <!-- Top Segment (overlapping) -->
    <path 
      d="M76 16 L36 68 H60 L68 60 L76 16 Z" 
      fill="url(#mathup-top-grad)" 
    />
  </g>
</svg>
