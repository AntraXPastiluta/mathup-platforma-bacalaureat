# MathUP local Docker stack
#
# Frontend only (cloud Supabase — recommended until local DB has a baseline schema):
#   docker compose up --build
# If @fontsource or other deps fail to resolve, reset the node_modules volume:
#   docker compose down -v && docker compose up --build
#
# Full local stack (Supabase CLI + frontend):
#   npm run docker:up:local
#   (starts local Supabase via npx in a Node container + Docker socket)
#
# Always stop profiled services too, or supabase-start keeps a stale network ref:
#   npm run docker:down
#   (not plain `docker compose down`, which skips profile [local] containers)
#
# Simpler alternative — Supabase on host, frontend in Docker:
#   cd backend && npx supabase start
#   npm run docker:up
#
# Production-like frontend smoke test:
#   docker compose --profile preview up --build frontend-preview

name: mathup

# Supabase CLI is not published as docker.io/supabase/cli — use Node + npx instead.
x-supabase-cli: &supabase-cli
  image: node:22-alpine
  working_dir: /workspace
  volumes:
    - ./backend:/workspace
    - /var/run/docker.sock:/var/run/docker.sock
  environment:
    DOCKER_HOST: unix:///var/run/docker.sock
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  # Runs once: starts Supabase local containers via Docker socket (same as `npx supabase start`).
  supabase-start:
    <<: *supabase-cli
    profiles: [local]
    command:
      - sh
      - -c
      - |
        apk add --no-cache docker-cli >/dev/null 2>&1 || true
        npx --yes supabase@2.102.0 start
    restart: "no"

  supabase-stop:
    <<: *supabase-cli
    profiles: [local-down]
    command:
      - sh
      - -c
      - npx --yes supabase@2.102.0 stop
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - path: frontend/.env.local
        required: false
    environment:
      DOCKER: "1"
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      supabase-start:
        condition: service_completed_successfully
        required: false

  frontend-preview:
    profiles: [preview]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports:
      - "${PREVIEW_PORT:-8080}:80"
    env_file:
      - path: frontend/.env.local
        required: false
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  frontend_node_modules:
